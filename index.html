<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta content="width=device-width, initial-scale=1.0" name="viewport">
		<link href="style.css" rel="stylesheet" type="text/css"/>
		<title>Kotlin Clock</title>
	</head>
	<body>

		<!--Center Content-->
		<div class="centered">
			<div class="window win-pos">
				<p>Clock.kt</p>
				<div class="dot">
					<a></a>
				</div>
			</div>
			<div class="border">
				<!-- Main Function -->
				<h1 class="code-line">
					<span class="keyword">fun</span>
					<span>&nbsp;</span>
					<span class="method-name">main</span>
					<span class="paren">()</span>
					<span>&nbsp;</span>
					<span class="bracket">&#123;</span>
				</h1>
				<!-- clock DSL builder -->
				<h1 class="code-line i1">
					<span class="keyword">val</span>
					<span>&nbsp;</span>
					<span class="variable-name" id="now">now</span>
					<span>&nbsp;</span>
					<span class="operator">=</span>
					<span>&nbsp;</span>
					<span class="method">clock</span>
					<span>&nbsp;</span>
					<span class="bracket">&#123;</span>
				</h1>
				<h1 class="code-line i2">
					<span class="property">year</span>
					<span>&nbsp;</span><span class="operator">=</span><span>&nbsp;</span>
					<span class="number" id="year">null</span>
				</h1>
				<h1 class="code-line i2">
					<span class="property">month</span>
					<span>&nbsp;</span><span class="operator">=</span><span>&nbsp;</span>
					<span class="string" id="month">null</span>
				</h1>
				<h1 class="code-line i2">
					<span class="property">day</span>
					<span>&nbsp;</span><span class="operator">=</span><span>&nbsp;</span>
					<span class="string" id="day">null</span>
				</h1>
				<h1 class="code-line i2">
					<span class="property">dayOfWeek</span>
					<span>&nbsp;</span><span class="operator">=</span><span>&nbsp;</span>
					<span class="string" id="dayOfWeek">null</span>
				</h1>
				<h1 class="code-line i2">
					<span class="property">period</span>
					<span>&nbsp;</span><span class="operator">=</span><span>&nbsp;</span>
					<span class="string" id="period">null</span>
				</h1>
				<h1 class="code-line i2">
					<span class="property">hour</span>
					<span>&nbsp;</span><span class="operator">=</span><span>&nbsp;</span>
					<span class="string" id="hour">null</span>
				</h1>
				<h1 class="code-line i2">
					<span class="property">minute</span>
					<span>&nbsp;</span><span class="operator">=</span><span>&nbsp;</span>
					<span class="string" id="minute">null</span>
				</h1>
				<h1 class="code-line i2">
					<span class="property">second</span>
					<span>&nbsp;</span><span class="operator">=</span><span>&nbsp;</span>
					<span class="string" id="second">null</span>
				</h1>
				<h1 class="code-line i1">
					<span class="bracket">&#125;</span>
				</h1>
				<h1 class="code-line">
					<span class="bracket">&#125;</span>
				</h1>
			</div>
		</div>

		<!--Scripts-->
		<script src="index.js"></script>
	</body>
</html>
